<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1B3A5C">
<meta name="description" content="領収証を作成してPDFで保存できるアプリ">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="領収証メーカー">
<title>領収証メーカー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
  :root{
    --paper:#FAF8F3;
    --paper-2:#F2EEE3;
    --ink:#1C2B36;
    --navy:#1B3A5C;
    --navy-2:#274C73;
    --seal:#B23A2E;
    --line:#D8D2C2;
    --muted:#7A746A;
    --white:#FFFFFF;
    --shadow: 0 18px 40px -20px rgba(28,43,54,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper-2);
    font-family:'Noto Sans JP', sans-serif;
    color:var(--ink);
    min-height:100vh;
  }
  .app{
    max-width:1180px;
    margin:0 auto;
    padding:28px 20px 64px;
  }
  .topbar{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:16px;
    margin-bottom:22px;
    flex-wrap:wrap;
  }
  .brandmark{
    display:flex;
    align-items:baseline;
    gap:12px;
  }
  .brandmark .kanji{
    font-family:'Noto Serif JP', serif;
    font-weight:700;
    font-size:26px;
    letter-spacing:0.04em;
    color:var(--navy);
  }
  .brandmark .sub{
    font-size:12px;
    color:var(--muted);
    letter-spacing:0.08em;
  }
  .save-status{
    font-size:12px;
    color:var(--muted);
    display:flex;
    align-items:center;
    gap:6px;
  }
  .save-status .dot{
    width:6px;height:6px;border-radius:50%;
    background:#3F8E5C;
    display:inline-block;
    transition:opacity .3s;
  }

  .tabs{
    display:none;
    margin-bottom:16px;
    border-bottom:1px solid var(--line);
  }
  .tabs button{
    flex:1;
    background:none;border:none;
    font-family:'Noto Sans JP',sans-serif;
    font-size:14px;font-weight:700;
    color:var(--muted);
    padding:12px 0;
    border-bottom:2px solid transparent;
    cursor:pointer;
  }
  .tabs button.active{
    color:var(--navy);
    border-bottom-color:var(--seal);
  }

  .layout{
    display:grid;
    grid-template-columns:minmax(360px,440px) 1fr;
    gap:28px;
    align-items:start;
  }

  /* ---------- FORM ---------- */
  .panel{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:14px;
    padding:22px 22px 26px;
  }
  .panel h2{
    font-family:'Noto Serif JP',serif;
    font-size:15px;
    margin:0 0 16px;
    color:var(--navy);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .panel h2 .bar{
    width:4px;height:14px;background:var(--seal);border-radius:2px;display:inline-block;
  }
  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-size:11.5px;
    color:var(--muted);
    margin-bottom:5px;
    letter-spacing:0.03em;
  }
  .field input,
  .field textarea,
  .field select{
    width:100%;
    border:1px solid var(--line);
    border-radius:8px;
    padding:9px 11px;
    font-size:14px;
    font-family:'Noto Sans JP',sans-serif;
    background:var(--paper);
    color:var(--ink);
    transition:border-color .15s, background .15s;
  }
  .field input:focus,
  .field textarea:focus,
  .field select:focus{
    outline:none;
    border-color:var(--navy-2);
    background:var(--white);
  }
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;min-width:0;}
  .row2 .field{min-width:0;}
  .row3{display:grid;grid-template-columns:1.4fr 0.7fr 0.9fr;gap:8px;}
  .divider{
    border:none;border-top:1px solid var(--line);
    margin:20px 0;
  }

  .items-head{
    display:grid;grid-template-columns:1.4fr 0.7fr 0.9fr 28px;gap:8px;
    font-size:10.5px;color:var(--muted);margin-bottom:6px;letter-spacing:0.03em;
  }
  .item-row{
    display:grid;grid-template-columns:1.4fr 0.7fr 0.9fr 28px;gap:8px;
    margin-bottom:8px;
    align-items:center;
    min-width:0;
  }
  .item-row input{padding:8px 9px;font-size:13.5px;min-width:0;width:100%;}
  .item-row .del-btn{
    justify-self:end;
  }
  .item-row .amt{font-variant-numeric:tabular-nums;text-align:right;}
  .del-btn{
    background:none;border:none;color:var(--muted);
    cursor:pointer;font-size:18px;line-height:1;
    width:28px;height:28px;border-radius:6px;
    display:flex;align-items:center;justify-content:center;
  }
  .del-btn:hover{background:#F4E6E3;color:var(--seal);}

  .add-row-btn{
    width:100%;
    border:1px dashed var(--line);
    background:var(--paper);
    color:var(--navy-2);
    font-size:13px;font-weight:700;
    padding:9px;border-radius:8px;
    cursor:pointer;
    margin-top:4px;
    font-family:'Noto Sans JP',sans-serif;
  }
  .add-row-btn:hover{background:#EDF1F5;border-color:var(--navy-2);}

  .tax-row{
    display:flex;align-items:center;gap:10px;
    margin-top:14px;font-size:13px;
  }
  .tax-row select{width:auto;flex-shrink:0;}

  .checkbox-line{
    display:flex;align-items:center;gap:8px;
    font-size:12.5px;color:var(--muted);
    margin-top:10px;
  }
  .checkbox-line input{width:auto;}

  .actions{
    display:flex;gap:10px;margin-top:22px;
  }
  .actions.actions-file{
    margin-top:10px;
  }
  .actions.actions-file .btn{
    font-size:13px;
    padding:11px 10px;
  }
  .pdf-guide{
    font-size:11.5px;
    color:var(--muted);
    line-height:1.6;
    margin:8px 2px 0;
    padding:10px 12px;
    background:var(--paper);
    border-radius:8px;
    border-left:3px solid var(--navy-2);
    display:none; /* JS で表示 */
  }
  .pdf-guide strong{color:var(--navy-2);}
  .pdf-guide.visible{display:block;}
  .pdf-guide .guide-step{
    margin:3px 0;
    padding-left:1em;
    text-indent:-1em;
  }
  .btn-dl{
    flex:1;
    border:2px solid var(--navy);
    border-radius:9px;
    background:var(--white);
    color:var(--navy);
    font-size:14px;font-weight:700;
    font-family:'Noto Sans JP',sans-serif;
    padding:11px 16px;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;
    transition:background .15s, color .15s;
  }
  .btn-dl:hover{background:var(--navy);color:var(--white);}
  .btn-dl:disabled{opacity:0.5;cursor:not-allowed;}
  .btn-dl.loading{opacity:0.7;cursor:wait;}
  .btn{
    flex:1;
    border:none;border-radius:9px;
    padding:13px 16px;
    font-size:14px;font-weight:700;
    font-family:'Noto Sans JP',sans-serif;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;
    transition:transform .12s, box-shadow .12s;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{
    background:var(--navy);color:var(--white);
    box-shadow:0 10px 20px -10px rgba(27,58,92,0.6);
  }
  .btn-primary:hover{background:var(--navy-2);}
  .btn-ghost{
    background:var(--paper);color:var(--ink);
    border:1px solid var(--line);
  }
  .btn-ghost:hover{border-color:var(--muted);}

  .new-link{
    text-align:center;margin-top:12px;
  }
  .new-link button{
    background:none;border:none;color:var(--muted);
    font-size:12px;text-decoration:underline;cursor:pointer;
    font-family:'Noto Sans JP',sans-serif;
  }

  /* ---------- PREVIEW ---------- */
  .preview-wrap{
    position:sticky;
    top:24px;
  }
  .preview-toolbar{
    display:flex;justify-content:flex-end;gap:8px;margin-bottom:12px;
  }
  .zoom-btn{
    width:30px;height:30px;border-radius:7px;
    border:1px solid var(--line);background:var(--white);
    font-size:15px;color:var(--navy);cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .zoom-btn:hover{background:var(--paper);}

  .receipt-stage{
    background:#EDE8DB;
    border-radius:16px;
    padding:32px 20px;
    display:flex;
    justify-content:center;
    overflow:auto;
  }

  #receipt{
    width:600px;
    min-height:0;
    background:var(--white);
    box-shadow:var(--shadow);
    position:relative;
    padding:40px 48px 36px;
    font-family:'Noto Sans JP',sans-serif;
    font-size:13px;
    color:var(--ink);
    flex-shrink:0;
  }
  #receipt::before{
    content:"";
    position:absolute;
    top:0;left:0;right:0;height:6px;
    background:linear-gradient(90deg, var(--navy) 0%, var(--navy) 70%, var(--seal) 70%, var(--seal) 100%);
  }
  .r-title{
    text-align:center;
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-weight:700;
    font-size:24px;
    letter-spacing:0.5em;
    padding-left:0.5em;
    color:var(--navy);
    margin:0 0 14px;
  }
  .r-top{
    display:flex;justify-content:space-between;align-items:flex-start;
    margin-bottom:10px;
  }
  .r-meta-left{font-size:13px;line-height:1.5;}
  .r-meta-left .num{color:var(--muted);font-size:11.5px;margin-bottom:4px;}
  .r-meta-right{text-align:right;font-size:13px;color:var(--muted);}

  .r-to{
    font-family:'Noto Serif JP',serif;
    font-size:18px;
    border-bottom:1.5px solid var(--ink);
    padding-bottom:6px;
    margin-bottom:14px;
    min-height:24px;
  }
  .r-to .sama{font-size:14px;font-family:'Noto Sans JP',sans-serif;margin-left:6px;color:var(--muted);}

  .r-amount-box{
    border:2px solid var(--navy);
    border-radius:4px;
    padding:10px 16px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:16px;
    background:#F7F9FB;
  }
  .r-amount-box .label{
    font-size:13px;color:var(--navy);font-weight:700;letter-spacing:0.1em;
  }
  .r-amount-box .yen{
    font-family:'Noto Serif JP',serif;
    font-size:26px;font-weight:700;color:var(--navy);
    font-variant-numeric:tabular-nums;
  }
  .r-amount-box .yen sup{font-size:14px;font-weight:500;margin-left:4px;}

  .r-desc{
    font-size:13px;color:var(--muted);margin-bottom:4px;
  }
  .r-desc-value{
    font-size:14px;
    border-bottom:1px dotted var(--line);
    padding-bottom:6px;
    margin-bottom:10px;
    min-height:20px;
  }

  table.r-table{
    width:100%;border-collapse:collapse;font-size:13px;margin-bottom:6px;
  }
  table.r-table th{
    background:var(--paper);
    color:var(--navy);
    font-weight:700;
    text-align:left;
    padding:5px 6px;
    border-bottom:1.5px solid var(--navy);
    font-size:11.5px;
    letter-spacing:0.04em;
  }
  table.r-table th.num{text-align:right;}
  table.r-table td{
    padding:5px 6px;
    border-bottom:1px solid var(--line);
  }
  table.r-table td.num{text-align:right;font-variant-numeric:tabular-nums;}

  .r-totals{
    margin-top:4px;
    margin-left:auto;
    width:240px;
  }
  .r-totals .line{
    display:flex;justify-content:space-between;
    font-size:13px;padding:3px 0;
  }
  .r-totals .line.grand{
    border-top:1.5px solid var(--ink);
    margin-top:2px;padding-top:6px;
    font-weight:700;font-size:15px;
    color:var(--navy);
  }
  .r-totals .num{font-variant-numeric:tabular-nums;}

  .r-foot{
    display:flex;justify-content:space-between;align-items:flex-end;
    margin-top:18px;
    padding-top:12px;
    border-top:1px solid var(--line);
  }
  .r-issuer{
    font-size:12.5px;line-height:1.6;color:var(--ink);
    white-space:pre-line;
  }
  .r-issuer .name{font-weight:700;font-size:14px;margin-bottom:3px;display:block;}

  .seal{
    width:60px;height:60px;
    border:2.5px solid var(--seal);
    border-radius:50%;
    color:var(--seal);
    display:flex;align-items:center;justify-content:center;
    font-family:'Noto Serif JP',serif;
    font-weight:700;
    font-size:11px;
    line-height:1.3;
    text-align:center;
    transform:rotate(-8deg);
    opacity:0;
    transition:opacity .4s, transform .4s;
    flex-shrink:0;
    margin-left:16px;
    letter-spacing:0.05em;
    writing-mode:horizontal-tb;
  }
  .seal.show{opacity:0.88;transform:rotate(-8deg) scale(1);}

  .r-note-label{font-size:10.5px;color:var(--muted);margin-top:8px;}

  @media (max-width:900px){
    .layout{grid-template-columns:1fr;}
    .tabs{display:flex;}
    .panel-form.hidden-mobile,
    .preview-section.hidden-mobile{display:none;}
    .preview-wrap{position:static;}
    .receipt-stage{padding:20px 8px;}
    #receipt{width:100%;max-width:600px;padding:26px 20px 24px;}
    .r-title{font-size:20px;letter-spacing:0.35em;}
    .topbar{margin-bottom:14px;}
  }

  /* ---------- 印刷(PDF保存)専用スタイル ----------
     画面サイズやタブの開閉状態に関係なく、領収証だけを綺麗にA4 1枚へ出力する */
  @media print{
    @page{
      size: A4;
      margin: 10mm;
    }
    html, body{
      background:#fff !important;
      margin:0;
      padding:0;
    }
    /* 領収証以外をすべて非表示にする */
    .topbar,
    .tabs,
    .panel-form,
    .preview-toolbar,
    .new-link{
      display:none !important;
    }
    .app{
      max-width:none;
      padding:0;
      margin:0;
    }
    .layout{
      display:block;
    }
    .preview-section,
    .preview-section.hidden-mobile{
      display:block !important;
    }
    .preview-wrap{
      position:static !important;
    }
    .receipt-stage{
      background:#fff !important;
      padding:0 !important;
      display:block !important;
      overflow:visible !important;
    }
    #receiptScaleWrap{
      transform:none !important;
    }
    #receipt{
      width:100% !important;
      max-width:170mm !important;
      box-shadow:none !important;
      margin:0 auto;
      page-break-inside:avoid;
    }
    .seal:not(.show){
      display:none !important;
    }
    .seal-image-el{
      width:60px !important;
      height:60px !important;
    }
  }
  /* ---------- 更新通知バナー ---------- */
  #updateBanner{
    position:fixed;
    bottom:16px;left:50%;transform:translateX(-50%);
    background:var(--navy);color:#fff;
    border-radius:12px;
    padding:12px 16px;
    display:flex;align-items:center;gap:12px;
    font-size:13px;font-family:'Noto Sans JP',sans-serif;
    box-shadow:0 8px 24px -8px rgba(27,58,92,0.7);
    z-index:9999;
    white-space:nowrap;
  }
  #updateNowBtn{
    background:var(--seal);color:#fff;
    border:none;border-radius:7px;
    padding:7px 14px;font-size:12.5px;font-weight:700;
    font-family:'Noto Sans JP',sans-serif;
    cursor:pointer;
  }
  #updateNowBtn:hover{opacity:0.85;}
  #updateLaterBtn{
    background:none;border:none;color:rgba(255,255,255,0.7);
    font-size:16px;cursor:pointer;line-height:1;padding:0 2px;
  }
  #updateLaterBtn:hover{color:#fff;}
  /* ---------- カスタム確認ダイアログ ---------- */
  #confirmOverlay{
    position:fixed;inset:0;
    background:rgba(28,43,54,0.55);
    display:flex;align-items:center;justify-content:center;
    z-index:10000;
    padding:20px;
  }
  #confirmBox{
    background:var(--white);
    border-radius:16px;
    padding:28px 28px 22px;
    max-width:360px;width:100%;
    box-shadow:0 24px 48px -12px rgba(28,43,54,0.45);
  }
  #confirmMsg{
    font-size:14px;line-height:1.6;
    color:var(--ink);margin:0 0 20px;
    white-space:pre-line;
  }
  #confirmBtns{display:flex;gap:10px;}
  #confirmBtns .btn{flex:1;padding:11px;}

  /* ---------- 履歴ボタン ---------- */
  .btn-history{
    background:none;border:1px solid var(--line);
    border-radius:8px;padding:7px 13px;
    font-size:12.5px;font-weight:700;
    font-family:'Noto Sans JP',sans-serif;
    color:var(--navy);cursor:pointer;
    white-space:nowrap;
  }
  .btn-history:hover{background:var(--paper);}

  /* ---------- 履歴パネル ---------- */
  #historyOverlay{
    position:fixed;inset:0;background:rgba(28,43,54,0.4);z-index:8000;
    cursor:pointer;
  }
  #historyPanel{
    position:fixed;top:0;right:0;bottom:0;
    width:min(380px, 92vw);
    background:var(--white);
    box-shadow:-12px 0 40px -10px rgba(28,43,54,0.25);
    z-index:8001;
    display:flex;flex-direction:column;
    transform:translateX(100%);
    transition:transform .28s cubic-bezier(.4,0,.2,1);
  }
  #historyPanel.open{transform:translateX(0);}
  #historyHeader{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 20px;
    border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  .history-title{
    font-family:'Noto Serif JP',serif;
    font-size:16px;font-weight:700;color:var(--navy);
  }
  #historyCloseBtn{
    background:none;border:none;font-size:18px;
    color:var(--muted);cursor:pointer;
    width:32px;height:32px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;
  }
  #historyCloseBtn:hover{background:var(--paper);}
  #historyList{
    overflow-y:auto;flex:1;padding:12px;
    display:flex;flex-direction:column;gap:8px;
  }
  #historyEmpty{
    padding:40px 20px;text-align:center;
    font-size:13px;color:var(--muted);line-height:1.7;
  }
  .history-item{
    border:1px solid var(--line);border-radius:10px;
    padding:12px 14px;cursor:pointer;
    transition:border-color .15s, background .15s;
    display:flex;align-items:flex-start;gap:10px;
  }
  .history-item:hover{border-color:var(--navy-2);background:#F0F4F8;}
  .history-item-body{flex:1;min-width:0;}
  .history-item-client{
    font-weight:700;font-size:13.5px;color:var(--ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .history-item-meta{
    font-size:11.5px;color:var(--muted);margin-top:3px;
  }
  .history-item-amount{
    font-size:14px;font-weight:700;color:var(--navy);
    font-variant-numeric:tabular-nums;white-space:nowrap;
  }
  .history-item-del{
    background:none;border:none;color:var(--muted);
    cursor:pointer;font-size:16px;
    width:28px;height:28px;border-radius:6px;
    flex-shrink:0;display:flex;align-items:center;justify-content:center;
  }
  .history-item-del:hover{background:#F4E6E3;color:var(--seal);}

  /* ---------- 印鑑画像アップロード ---------- */
  #sealImageArea{margin-top:8px;}
  .seal-options{display:flex;gap:16px;margin-bottom:8px;}
  .seal-opt-label{
    font-size:12.5px;color:var(--muted);
    display:flex;align-items:center;gap:5px;cursor:pointer;
  }
  .seal-opt-label input{width:auto;}
  #sealImageUploadArea{
    border:1px dashed var(--line);border-radius:10px;
    padding:12px;background:var(--paper);
    margin-top:4px;
  }
  #sealImagePreview{
    width:80px;height:80px;border-radius:50%;
    overflow:hidden;margin:0 auto 10px;
    border:2px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    background:var(--white);
  }
  #sealImagePreview img{
    width:100%;height:100%;object-fit:contain;
  }
  .seal-upload-btns{display:flex;gap:8px;justify-content:center;}
  .seal-upload-hint{
    font-size:11px;color:var(--muted);
    text-align:center;margin:8px 0 0;line-height:1.5;
  }
  /* 印刷時の画像印鑑 */
  .seal-image-el{
    width:60px;height:60px;
    object-fit:contain;
    transform:rotate(-8deg);
    flex-shrink:0;
    margin-left:16px;
    opacity:0.9;
  }
</style>
</head>
<body>

<div id="updateBanner" style="display:none;" aria-live="polite">
  <span>🔄 アプリの新しいバージョンがあります</span>
  <button id="updateNowBtn">今すぐ更新</button>
  <button id="updateLaterBtn" aria-label="後で">✕</button>
</div>

<!-- カスタム確認ダイアログ -->
<div id="confirmOverlay" role="dialog" aria-modal="true" aria-labelledby="confirmMsg" style="display:none;">
  <div id="confirmBox">
    <p id="confirmMsg"></p>
    <div id="confirmBtns">
      <button id="confirmCancel" class="btn btn-ghost">キャンセル</button>
      <button id="confirmOk" class="btn btn-primary">OK</button>
    </div>
  </div>
</div>
<!-- 履歴パネル -->
<div id="historyOverlay" style="display:none;"></div>
<div id="historyPanel" aria-label="領収証履歴">
  <div id="historyHeader">
    <span class="history-title">発行履歴</span>
    <button id="historyCloseBtn" aria-label="閉じる">✕</button>
  </div>
  <div id="historyList"></div>
  <p id="historyEmpty" style="display:none;">まだ履歴がありません。<br>PDFで保存すると自動で記録されます。</p>
</div>

<div class="app">
  <div class="topbar">
    <div class="brandmark">
      <span class="kanji">領収証メーカー</span>
      <span class="sub">RECEIPT MAKER</span>
    </div>
    <div class="save-status">
      <span class="dot" id="saveDot"></span>
      <span id="saveText">自動保存ずみ</span>
    </div>
    <button class="btn-history" id="historyBtn">📋 履歴</button>
  </div>

  <div class="tabs">
    <button id="tabFormBtn" class="active">入力</button>
    <button id="tabPreviewBtn">プレビュー</button>
  </div>

  <div class="layout">
    <!-- ============ FORM ============ -->
    <div class="panel panel-form" id="panelForm">

      <h2><span class="bar"></span>宛先・日付</h2>
      <div class="field">
        <label for="clientName">宛名(お客様名)</label>
        <input id="clientName" type="text" placeholder="山田 太郎">
      </div>
      <div class="row2">
        <div class="field">
          <label for="issueDate">発行日</label>
          <input id="issueDate" type="date">
        </div>
        <div class="field">
          <label for="receiptNo">領収証番号</label>
          <input id="receiptNo" type="text" placeholder="No.0001">
        </div>
      </div>

      <h2><span class="bar"></span>品目・金額</h2>
      <div class="items-head">
        <span>内容</span><span>単価</span><span>数量</span><span></span>
      </div>
      <div id="itemsContainer"></div>
      <button class="add-row-btn" id="addItemBtn">＋ 行を追加</button>

      <div class="tax-row">
        <label for="taxRate" style="margin:0;color:var(--muted);">税区分・入力方式</label>
        <select id="taxRate">
          <option value="10_ex">10% 対象（税抜で入力）</option>
          <option value="10_in">10% 対象（税込で入力）</option>
          <option value="8_ex">8% 対象・軽減税率（税抜で入力）</option>
          <option value="8_in">8% 対象・軽減税率（税込で入力）</option>
          <option value="0">非課税</option>
        </select>
      </div>

      <div class="field" style="margin-top:14px;">
        <label for="purpose">お品代・但し書き</label>
        <input id="purpose" type="text" placeholder="例:お品代として">
      </div>

      <hr class="divider">

      <h2><span class="bar"></span>発行者情報(自分の店舗・会社)</h2>
      <div class="field">
        <label for="issuerName">発行者名</label>
        <input id="issuerName" type="text" placeholder="株式会社サンプル / 山田商店">
      </div>
      <div class="field">
        <label for="issuerAddr">住所</label>
        <textarea id="issuerAddr" rows="2" placeholder="〒100-0001 東京都千代田区..."></textarea>
      </div>
      <div class="row2">
        <div class="field">
          <label for="issuerTel">電話番号</label>
          <input id="issuerTel" type="text" placeholder="03-1234-5678">
        </div>
        <div class="field">
          <label for="issuerReg">登録番号(任意)</label>
          <input id="issuerReg" type="text" placeholder="T1234567890123">
        </div>
      </div>
      <div class="checkbox-line">
        <input type="checkbox" id="showSeal" checked>
        <label for="showSeal" style="margin:0;">角印を表示する</label>
      </div>
      <div id="sealImageArea">
        <div class="seal-options">
          <label class="seal-opt-label">
            <input type="radio" name="sealType" value="text" checked> テキスト印（自動生成）
          </label>
          <label class="seal-opt-label">
            <input type="radio" name="sealType" value="image"> 画像をアップロード
          </label>
        </div>
        <div id="sealImageUploadArea" style="display:none;">
          <div id="sealImagePreview"></div>
          <div class="seal-upload-btns">
            <button class="btn btn-ghost" id="sealUploadBtn" style="font-size:12px;padding:8px 12px;">📷 画像を選択</button>
            <button class="btn btn-ghost" id="sealClearBtn" style="font-size:12px;padding:8px 12px;display:none;">🗑 削除</button>
          </div>
          <input type="file" id="sealFileInput" accept="image/*" style="display:none;">
          <p class="seal-upload-hint">PNG/JPG推奨。背景が透明なPNGだときれいに合成されます。</p>
        </div>
      </div>

      <div class="actions">
        <button class="btn btn-ghost" id="resetBtn">クリア</button>
        <button class="btn btn-primary" id="pdfBtn">🖨 印刷でPDF保存</button>
      </div>
      <div class="actions" style="margin-top:8px;">
        <button class="btn btn-dl" id="dlBtn">⬇ PDFをダウンロード</button>
      </div>
      <div id="pdfGuide" class="pdf-guide"></div>
      <div class="actions actions-file">
        <button class="btn btn-ghost" id="saveFileBtn">📁 ファイルに保存</button>
        <button class="btn btn-ghost" id="loadFileBtn">📂 ファイルを開く</button>
        <input type="file" id="loadFileInput" accept="application/json,.json" style="display:none;">
      </div>
      <div class="new-link">
        <button id="newReceiptBtn">発行者情報を残して新しい領収証を作成</button>
      </div>
    </div>

    <!-- ============ PREVIEW ============ -->
    <div class="preview-section" id="panelPreview">
      <div class="preview-wrap">
        <div class="preview-toolbar">
          <button class="zoom-btn" id="zoomOut">－</button>
          <button class="zoom-btn" id="zoomIn">＋</button>
        </div>
        <div class="receipt-stage">
          <div id="receiptScaleWrap">
            <div id="receipt">
              <div class="r-title">領　収　証</div>
              <div class="r-top">
                <div class="r-meta-left">
                  <div class="num" id="pvNo">No.</div>
                </div>
                <div class="r-meta-right" id="pvDate">2026年6月21日</div>
              </div>
              <div class="r-to"><span id="pvClient">　　　　　　　</span><span class="sama">様</span></div>

              <div class="r-amount-box">
                <span class="label">合計金額</span>
                <span class="yen">¥<span id="pvTotal">0</span><sup>−</sup></span>
              </div>

              <div class="r-desc">但し</div>
              <div class="r-desc-value" id="pvPurpose"></div>

              <table class="r-table">
                <thead>
                  <tr><th>内容</th><th class="num">単価</th><th class="num">数量</th><th class="num">金額</th></tr>
                </thead>
                <tbody id="pvItemsBody"></tbody>
              </table>

              <div class="r-totals" id="pvTotals"></div>

              <div class="r-foot">
                <div class="r-issuer" id="pvIssuer">
                  <span class="name">　</span>
                </div>
                <div class="seal" id="pvSeal">印</div>
              </div>
              <div class="r-note-label" id="pvRegNote"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  // ---------- storage keys ----------
  const DRAFT_KEY = "receiptMaker_draft_v1";
  const ISSUER_KEY = "receiptMaker_issuer_v1";

  function todayLocalIso(){
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,"0");
    const day = String(d.getDate()).padStart(2,"0");
    return `${y}-${m}-${day}`;
  }

  // ---------- state ----------
  let state = {
    clientName:"",
    issueDate: todayLocalIso(),
    receiptNo:"",
    items:[ {name:"", price:"", qty:"1"} ],
    taxRate:"10_ex",
    purpose:"",
    issuerName:"",
    issuerAddr:"",
    issuerTel:"",
    issuerReg:"",
    showSeal:true,
    sealType:"text",
    sealImageData:""
  };

  let zoom = 1;
  let saveTimer = null;

  // ---------- helpers ----------
  function yen(n){
    if(isNaN(n)) n = 0;
    return Math.round(n).toLocaleString("ja-JP");
  }
  function toNum(v){
    const n = parseFloat(String(v).replace(/[,，]/g,""));
    return isNaN(n) ? 0 : n;
  }
  function formatDateJp(iso){
    if(!iso) return "";
    const [y,m,d] = iso.split("-");
    if(!y) return "";
    return `${y}年${parseInt(m,10)}月${parseInt(d,10)}日`;
  }

  // ---------- DOM refs ----------
  const el = id => document.getElementById(id);
  const itemsContainer = el("itemsContainer");

  // ---------- load ----------
  function loadIssuer(){
    try{
      const raw = localStorage.getItem(ISSUER_KEY);
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  }
  function loadDraft(){
    try{
      const raw = localStorage.getItem(DRAFT_KEY);
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  }

  // 旧バージョンで保存したtaxRate("10","8","0")を新形式に変換する後方互換処理
  function migrateTaxRate(v){
    if(v === "10") return "10_ex";
    if(v === "8")  return "8_ex";
    return v || "10_ex";
  }

  (function initState(){
    const issuer = loadIssuer();
    const draft = loadDraft();
    if(draft){
      state = Object.assign(state, draft);
      state.taxRate = migrateTaxRate(state.taxRate); // 後方互換
      if(!state.items || !state.items.length){
        state.items = [{name:"",price:"",qty:"1"}];
      }
    }
    // 発行者情報は専用ストアを優先(下書きより新しい場合に備える)。
    // 下書きに値があり専用ストアが空なら下書きの値を使う。
    if(issuer){
      state.issuerName = issuer.issuerName || state.issuerName || "";
      state.issuerAddr = issuer.issuerAddr || state.issuerAddr || "";
      state.issuerTel  = issuer.issuerTel  || state.issuerTel  || "";
      state.issuerReg  = issuer.issuerReg  || state.issuerReg  || "";
    }
  })();

  // ---------- save ----------
  function saveAll(){
    try{
      localStorage.setItem(DRAFT_KEY, JSON.stringify(state));
      localStorage.setItem(ISSUER_KEY, JSON.stringify({
        issuerName:state.issuerName,
        issuerAddr:state.issuerAddr,
        issuerTel:state.issuerTel,
        issuerReg:state.issuerReg
      }));
      flashSaved();
    }catch(e){}
  }
  function scheduleSave(){
    el("saveText").textContent = "保存中…";
    el("saveDot").style.opacity = "0.35";
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveAll, 350);
  }
  function flashSaved(){
    el("saveText").textContent = "自動保存ずみ";
    el("saveDot").style.opacity = "1";
  }

  // ---------- render form ----------
  function renderItemsForm(){
    itemsContainer.innerHTML = "";
    state.items.forEach((item, idx)=>{
      const row = document.createElement("div");
      row.className = "item-row";
      row.innerHTML = `
        <input type="text" data-field="name" data-idx="${idx}" placeholder="例:コンサルティング費用" value="${escapeAttr(item.name)}">
        <input type="text" data-field="price" data-idx="${idx}" placeholder="0" value="${escapeAttr(item.price)}" inputmode="decimal">
        <input type="text" data-field="qty" data-idx="${idx}" placeholder="1" value="${escapeAttr(item.qty)}" inputmode="decimal" title="小数も入力できます(例: 0.5)">
        <button class="del-btn" data-del="${idx}" title="この行を削除">×</button>
      `;
      itemsContainer.appendChild(row);
    });
  }
  function escapeAttr(v){
    return String(v===undefined||v===null?"":v).replace(/"/g,"&quot;");
  }
  function escapeHtml(v){
    const d = document.createElement("div");
    d.textContent = v===undefined||v===null?"":v;
    return d.innerHTML;
  }

  function populateFormFromState(){
    el("clientName").value = state.clientName;
    el("issueDate").value = state.issueDate;
    el("receiptNo").value = state.receiptNo;
    el("taxRate").value = state.taxRate;
    el("purpose").value = state.purpose;
    el("issuerName").value = state.issuerName;
    el("issuerAddr").value = state.issuerAddr;
    el("issuerTel").value = state.issuerTel;
    el("issuerReg").value = state.issuerReg;
    el("showSeal").checked = !!state.showSeal;
    // 印鑑タイプの復元
    const sealType = state.sealType || "text";
    document.querySelectorAll('input[name="sealType"]').forEach(r=>{
      r.checked = (r.value === sealType);
    });
    applySealTypeUI(sealType);
    renderItemsForm();
  }

  // ---------- compute ----------
  // taxRate の値体系:
  //   "10_ex" = 10%・税抜入力  "10_in" = 10%・税込入力
  //   "8_ex"  = 8%・税抜入力   "8_in"  = 8%・税込入力
  //   "0"     = 非課税
  function parseTaxRate(v){
    if(!v || v === "0") return {rate:0, inclusive:false};
    const [rateStr, mode] = v.split("_");
    return {rate: parseInt(rateStr, 10), inclusive: mode === "in"};
  }

  function computeTotals(){
    const {rate, inclusive} = parseTaxRate(state.taxRate);
    let lineTotal = 0;
    state.items.forEach(it=>{
      lineTotal += toNum(it.price) * (toNum(it.qty) || 0);
    });

    let subtotal = 0, tax = 0, total = 0;
    if(rate === 0){
      // 非課税: 合計=入力値合計、消費税なし
      subtotal = lineTotal;
      tax = 0;
      total = lineTotal;
    } else if(inclusive){
      // 税込入力: 入力値が税込金額。消費税を逆算（切捨て）
      // 税額 = 税込金額 × 税率 ÷ (100 + 税率)  端数切捨て
      total = lineTotal;
      tax = Math.floor(total * rate / (100 + rate));
      subtotal = total - tax;
    } else {
      // 税抜入力: 入力値が税抜金額。消費税を加算（切捨て）
      // 国税庁ガイドライン: 品目ごとではなく請求書単位での端数処理が一般的
      subtotal = lineTotal;
      tax = Math.floor(subtotal * rate / 100);
      total = subtotal + tax;
    }
    return {subtotal, tax, total, rate, inclusive};
  }

  // ---------- render preview ----------
  function renderPreview(){
    el("pvNo").textContent = state.receiptNo ? `No. ${state.receiptNo}` : "No.";
    el("pvDate").textContent = formatDateJp(state.issueDate) || "　";
    el("pvClient").textContent = state.clientName || "　　　　　　　";
    el("pvPurpose").textContent = state.purpose || "　";

    const tbody = el("pvItemsBody");
    tbody.innerHTML = "";
    state.items.forEach(it=>{
      if(!it.name && !it.price && !it.qty) return;
      const amount = toNum(it.price) * (toNum(it.qty)||0);
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${escapeHtml(it.name) || "&nbsp;"}</td>
        <td class="num">${it.price!=="" ? "¥"+yen(toNum(it.price)) : ""}</td>
        <td class="num">${it.qty!=="" ? it.qty : ""}</td>
        <td class="num">${(it.price!=="" || it.qty!=="") ? "¥"+yen(amount) : ""}</td>
      `;
      tbody.appendChild(tr);
    });
    if(!tbody.children.length){
      tbody.innerHTML = `<tr><td>&nbsp;</td><td class="num"></td><td class="num"></td><td class="num"></td></tr>`;
    }

    const {subtotal, tax, total, rate, inclusive} = computeTotals();
    el("pvTotal").textContent = yen(total);

    const totalsDiv = el("pvTotals");
    if(rate > 0){
      if(inclusive){
        // 税込入力: 入力値の合計=税込合計。「うち消費税」を内訳表示
        totalsDiv.innerHTML = `
          <div class="line grand"><span>合計(税込)</span><span class="num">¥${yen(total)}</span></div>
          <div class="line"><span>　うち消費税(${rate}%)</span><span class="num">¥${yen(tax)}</span></div>
        `;
      } else {
        // 税抜入力: 小計(税抜) + 消費税 = 合計
        totalsDiv.innerHTML = `
          <div class="line"><span>小計(税抜)</span><span class="num">¥${yen(subtotal)}</span></div>
          <div class="line"><span>消費税(${rate}%)</span><span class="num">¥${yen(tax)}</span></div>
          <div class="line grand"><span>合計(税込)</span><span class="num">¥${yen(total)}</span></div>
        `;
      }
    } else {
      totalsDiv.innerHTML = `
        <div class="line grand"><span>合計(非課税)</span><span class="num">¥${yen(total)}</span></div>
      `;
    }

    const issuerDiv = el("pvIssuer");
    let issuerHtml = `<span class="name">${escapeHtml(state.issuerName) || "　"}</span>`;
    if(state.issuerAddr) issuerHtml += escapeHtml(state.issuerAddr).replace(/\n/g,"<br>") + "<br>";
    if(state.issuerTel) issuerHtml += `TEL: ${escapeHtml(state.issuerTel)}`;
    issuerDiv.innerHTML = issuerHtml;

    el("pvRegNote").textContent = state.issuerReg ? `登録番号: ${state.issuerReg}` : "";

    const sealContainer = el("pvSeal").parentElement;
    // 既存の画像印鑑要素を削除（再レンダリング対応）
    const existingImgSeal = sealContainer.querySelector(".seal-image-el");
    if(existingImgSeal) existingImgSeal.remove();

    const seal = el("pvSeal");
    const shouldShow = state.showSeal && state.issuerName;

    if(state.sealType === "image" && state.sealImageData && shouldShow){
      // 画像印鑑
      seal.style.display = "none";
      const img = document.createElement("img");
      img.className = "seal-image-el";
      img.src = state.sealImageData;
      img.alt = "印鑑";
      sealContainer.appendChild(img);
    } else {
      // テキスト印（CSS描画）
      seal.style.display = "";
      const sealText = (state.issuerName || "印").trim();
      seal.textContent = sealText.length > 4 ? sealText.slice(0,4) : (sealText || "印");
      if(shouldShow){
        seal.classList.add("show");
      } else {
        seal.classList.remove("show");
      }
    }
  }

  function renderAll(){
    renderPreview();
  }

  // ---------- bind form events ----------
  function bindSimpleField(inputId, stateKey, transform){
    el(inputId).addEventListener("input", e=>{
      state[stateKey] = transform ? transform(e.target.value) : e.target.value;
      renderAll();
      scheduleSave();
    });
  }
  bindSimpleField("clientName","clientName");
  bindSimpleField("issueDate","issueDate");
  bindSimpleField("receiptNo","receiptNo");
  bindSimpleField("taxRate","taxRate");
  bindSimpleField("purpose","purpose");
  bindSimpleField("issuerName","issuerName");
  bindSimpleField("issuerAddr","issuerAddr");
  bindSimpleField("issuerTel","issuerTel");
  bindSimpleField("issuerReg","issuerReg");
  el("showSeal").addEventListener("change", e=>{
    state.showSeal = e.target.checked;
    el("sealImageArea").style.display = state.showSeal ? "" : "none";
    renderAll();
    scheduleSave();
  });

  // ---------- 印鑑タイプ切替 ----------
  function applySealTypeUI(type){
    el("sealImageUploadArea").style.display = type === "image" ? "" : "none";
    // 画像プレビューを更新
    const prev = el("sealImagePreview");
    prev.innerHTML = state.sealImageData
      ? `<img src="${state.sealImageData}" alt="印鑑プレビュー">`
      : "";
    el("sealClearBtn").style.display = state.sealImageData ? "" : "none";
  }
  document.querySelectorAll('input[name="sealType"]').forEach(radio=>{
    radio.addEventListener("change", e=>{
      state.sealType = e.target.value;
      applySealTypeUI(state.sealType);
      renderAll();
      scheduleSave();
    });
  });
  el("sealUploadBtn").addEventListener("click", ()=>{ el("sealFileInput").value=""; el("sealFileInput").click(); });
  el("sealClearBtn").addEventListener("click", ()=>{
    state.sealImageData = "";
    applySealTypeUI(state.sealType);
    renderAll();
    scheduleSave();
  });
  el("sealFileInput").addEventListener("change", e=>{
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    if(!file.type.startsWith("image/")){
      alert("画像ファイル(PNG/JPG/GIF)を選んでください。");
      return;
    }
    if(file.size > 2 * 1024 * 1024){
      alert("ファイルサイズが大きすぎます。2MB以下の画像を選んでください。");
      return;
    }
    const reader = new FileReader();
    reader.onload = ev=>{
      state.sealImageData = ev.target.result;
      applySealTypeUI(state.sealType);
      renderAll();
      scheduleSave();
    };
    reader.readAsDataURL(file);
  });
  // showSeal初期状態でエリアを制御
  el("sealImageArea").style.display = state.showSeal ? "" : "none";

  // ---------- 履歴機能 ----------
  const HISTORY_KEY = "receiptMaker_history_v1";
  const HISTORY_MAX = 20;

  function loadHistory(){
    try{ return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; }
    catch(e){ return []; }
  }
  function saveHistory(list){
    try{ localStorage.setItem(HISTORY_KEY, JSON.stringify(list)); }catch(e){}
  }
  // 現在の領収証を履歴に保存（PDFで保存ボタン押下時に呼ぶ）
  function pushHistory(){
    const {total} = computeTotals();
    if(!state.clientName && total === 0) return; // 空の場合は保存しない
    const list = loadHistory();
    const entry = {
      id: Date.now(),
      savedAt: new Date().toISOString(),
      clientName: state.clientName,
      issueDate: state.issueDate,
      receiptNo: state.receiptNo,
      total: total,
      snapshot: JSON.parse(JSON.stringify(state))
    };
    // 同じidの重複を除去して先頭に追加
    const filtered = list.filter(h=>h.id !== entry.id);
    filtered.unshift(entry);
    saveHistory(filtered.slice(0, HISTORY_MAX));
  }

  function renderHistoryList(){
    const list = loadHistory();
    const listEl = el("historyList");
    const emptyEl = el("historyEmpty");
    listEl.innerHTML = "";
    if(list.length === 0){
      emptyEl.style.display = "";
      return;
    }
    emptyEl.style.display = "none";
    list.forEach(h=>{
      const item = document.createElement("div");
      item.className = "history-item";
      const savedAt = new Date(h.savedAt);
      const dateStr = `${savedAt.getFullYear()}/${String(savedAt.getMonth()+1).padStart(2,"0")}/${String(savedAt.getDate()).padStart(2,"0")}`;
      item.innerHTML = `
        <div class="history-item-body">
          <div class="history-item-client">${escapeHtml(h.clientName || "(宛名なし)")}</div>
          <div class="history-item-meta">${escapeHtml(h.receiptNo || "")} ${h.issueDate ? escapeHtml(formatDateJp(h.issueDate)) : ""}<br>保存: ${dateStr}</div>
        </div>
        <div class="history-item-amount">¥${yen(h.total)}</div>
        <button class="history-item-del" data-hid="${h.id}" title="履歴から削除">×</button>
      `;
      item.querySelector(".history-item-body").addEventListener("click", ()=>{
        restoreFromHistory(h);
      });
      item.querySelector(".history-item-del").addEventListener("click", async e=>{
        e.stopPropagation();
        if(!await showConfirm("この履歴を削除しますか?")) return;
        const updated = loadHistory().filter(x=>x.id !== h.id);
        saveHistory(updated);
        renderHistoryList();
      });
      listEl.appendChild(item);
    });
  }

  function restoreFromHistory(h){
    state = Object.assign({
      sealType:"text", sealImageData:""
    }, JSON.parse(JSON.stringify(h.snapshot)));
    populateFormFromState();
    renderAll();
    saveAll();
    closeHistory();
    if(window.innerWidth <= 900){ activateTab("form"); }
  }

  function openHistory(){
    renderHistoryList();
    el("historyOverlay").style.display = "";
    el("historyPanel").classList.add("open");
  }
  function closeHistory(){
    el("historyPanel").classList.remove("open");
    setTimeout(()=>{ el("historyOverlay").style.display = "none"; }, 280);
  }
  el("historyBtn").addEventListener("click", openHistory);
  el("historyCloseBtn").addEventListener("click", closeHistory);
  el("historyOverlay").addEventListener("click", closeHistory);

  itemsContainer.addEventListener("input", e=>{
    const idx = e.target.getAttribute("data-idx");
    const field = e.target.getAttribute("data-field");
    if(idx===null || !field) return;
    state.items[idx][field] = e.target.value;
    renderAll();
    scheduleSave();
  });
  itemsContainer.addEventListener("click", e=>{
    const delIdx = e.target.getAttribute("data-del");
    if(delIdx===null) return;
    state.items.splice(parseInt(delIdx,10),1);
    if(state.items.length === 0){
      state.items.push({name:"",price:"",qty:"1"});
    }
    renderItemsForm();
    renderAll();
    scheduleSave();
  });

  el("addItemBtn").addEventListener("click", ()=>{
    state.items.push({name:"",price:"",qty:"1"});
    renderItemsForm();
    renderAll();
    scheduleSave();
    const rows = itemsContainer.querySelectorAll(".item-row");
    const last = rows[rows.length-1];
    if(last){ last.querySelector('input[data-field="name"]').focus(); }
  });

  // ---------- カスタム確認ダイアログ ----------
  function showConfirm(message){
    return new Promise((resolve)=>{
      el("confirmMsg").textContent = message;
      el("confirmOverlay").style.display = "flex";
      el("confirmOk").focus();
      function cleanup(result){
        el("confirmOverlay").style.display = "none";
        el("confirmOk").onclick = null;
        el("confirmCancel").onclick = null;
        resolve(result);
      }
      el("confirmOk").onclick = ()=>cleanup(true);
      el("confirmCancel").onclick = ()=>cleanup(false);
    });
  }

  el("resetBtn").addEventListener("click", async ()=>{
    if(!await showConfirm("入力内容をすべてクリアします。\nよろしいですか?\n(発行者情報は保持されます)")) return;
    const keepIssuer = {
      issuerName: state.issuerName,
      issuerAddr: state.issuerAddr,
      issuerTel: state.issuerTel,
      issuerReg: state.issuerReg
    };
    state = {
      clientName:"",
      issueDate: todayLocalIso(),
      receiptNo:"",
      items:[{name:"",price:"",qty:"1"}],
      taxRate:"10_ex",
      purpose:"",
      showSeal:true,
      sealType:"text", sealImageData:"",
      ...keepIssuer
    };
    populateFormFromState();
    renderAll();
    saveAll();
  });

  // ---------- 領収証番号の自動採番 ----------
  // "No.0001", "0042", "A-0005", "2026-001" など末尾の数字列を+1する。
  // 数字が見つからない場合は末尾に "-2" を付与する。
  function incrementReceiptNo(current){
    if(!current || !current.trim()) return "No.0001";
    const match = current.match(/^(.*?)(\d+)(\D*)$/);
    if(!match) return current + "-2";
    const prefix = match[1];
    const numStr = match[2];
    const suffix = match[3];
    const nextNum = parseInt(numStr, 10) + 1;
    const paddedNum = String(nextNum).padStart(numStr.length, "0");
    return prefix + paddedNum + suffix;
  }

  el("newReceiptBtn").addEventListener("click", ()=>{
    const prevReceiptNo = state.receiptNo;
    const keepIssuer = {
      issuerName: state.issuerName,
      issuerAddr: state.issuerAddr,
      issuerTel: state.issuerTel,
      issuerReg: state.issuerReg
    };
    state = {
      clientName:"",
      issueDate: todayLocalIso(),
      receiptNo: incrementReceiptNo(prevReceiptNo),
      items:[{name:"",price:"",qty:"1"}],
      taxRate:"10_ex",
      purpose:"",
      showSeal:true,
      sealType:"text", sealImageData:"",
      ...keepIssuer
    };
    populateFormFromState();
    renderAll();
    saveAll();
    if(window.innerWidth <= 900){ activateTab("preview"); }
  });

  // ---------- file save / load (JSON) ----------
  function buildJsonFileName(){
    const datePart = (state.issueDate || "").replace(/-/g,"");
    const namePart = (state.clientName || "領収証データ").replace(/[\\/:*?"<>|]/g,"");
    return `領収証データ_${namePart}${datePart ? "_"+datePart : ""}.json`;
  }

  el("saveFileBtn").addEventListener("click", ()=>{
    try{
      const payload = {
        appName: "領収証メーカー",
        fileVersion: 1,
        savedAt: new Date().toISOString(),
        data: state
      };
      const json = JSON.stringify(payload, null, 2);
      const blob = new Blob([json], {type:"application/json"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = buildJsonFileName();
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }catch(err){
      alert("ファイルの保存に失敗しました。もう一度お試しください。");
      console.error(err);
    }
  });

  el("loadFileBtn").addEventListener("click", ()=>{
    el("loadFileInput").value = "";
    el("loadFileInput").click();
  });

  el("loadFileInput").addEventListener("change", (e)=>{
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev)=>{
      try{
        const parsed = JSON.parse(ev.target.result);
        const incoming = parsed && parsed.data ? parsed.data : parsed; // 旧形式(dataラップなし)にも対応
        if(!incoming || typeof incoming !== "object"){
          throw new Error("invalid format");
        }
        const merged = {
          clientName:"", issueDate: todayLocalIso(), receiptNo:"",
          items:[{name:"",price:"",qty:"1"}], taxRate:"10_ex", purpose:"",
          issuerName:"", issuerAddr:"", issuerTel:"", issuerReg:"", showSeal:true, sealType:"text", sealImageData:"",
          ...incoming
        };
        if(!Array.isArray(merged.items) || !merged.items.length){
          merged.items = [{name:"",price:"",qty:"1"}];
        }
        merged.taxRate = migrateTaxRate(merged.taxRate); // 後方互換
        state = merged;
        populateFormFromState();
        renderAll();
        saveAll();
        if(window.innerWidth <= 900){ activateTab("preview"); }
      }catch(err){
        alert("このファイルは読み込めませんでした。領収証メーカーで保存したJSONファイルを選んでください。");
        console.error(err);
      }
    };
    reader.onerror = ()=>{
      alert("ファイルの読み込みに失敗しました。");
    };
    reader.readAsText(file, "utf-8");
  });

  // ---------- tabs (mobile) ----------
  function activateTab(which){
    const formBtn = el("tabFormBtn"), prevBtn = el("tabPreviewBtn");
    const formPanel = el("panelForm"), prevPanel = el("panelPreview");
    if(which === "form"){
      formBtn.classList.add("active"); prevBtn.classList.remove("active");
      formPanel.classList.remove("hidden-mobile"); prevPanel.classList.add("hidden-mobile");
    } else {
      prevBtn.classList.add("active"); formBtn.classList.remove("active");
      prevPanel.classList.remove("hidden-mobile"); formPanel.classList.add("hidden-mobile");
    }
  }
  el("tabFormBtn").addEventListener("click", ()=>activateTab("form"));
  el("tabPreviewBtn").addEventListener("click", ()=>activateTab("preview"));
  function applyResponsiveDefault(){
    if(window.innerWidth <= 900){
      el("panelPreview").classList.add("hidden-mobile");
    } else {
      el("panelForm").classList.remove("hidden-mobile");
      el("panelPreview").classList.remove("hidden-mobile");
    }
  }
  window.addEventListener("resize", applyResponsiveDefault);

  // ---------- zoom ----------
  const ZOOM_KEY = "receiptMaker_zoom_v1";
  function applyZoom(){
    el("receiptScaleWrap").style.transform = `scale(${zoom})`;
    el("receiptScaleWrap").style.transformOrigin = "top center";
    try{ localStorage.setItem(ZOOM_KEY, String(zoom)); }catch(e){}
  }
  (function loadZoom(){
    try{
      const v = parseFloat(localStorage.getItem(ZOOM_KEY));
      if(!isNaN(v) && v >= 0.5 && v <= 1.4){ zoom = v; }
    }catch(e){}
  })();
  el("zoomIn").addEventListener("click", ()=>{ zoom = Math.min(1.4, parseFloat((zoom+0.1).toFixed(1))); applyZoom(); });
  el("zoomOut").addEventListener("click", ()=>{ zoom = Math.max(0.5, parseFloat((zoom-0.1).toFixed(1))); applyZoom(); });
  applyZoom();

  // ---------- PDF export (ブラウザの印刷機能を利用) ----------
  // ---------- デバイス判定 ----------
  function detectDevice(){
    const ua = navigator.userAgent;
    const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
    const isAndroid = /Android/.test(ua);
    const isStandalone = window.matchMedia("(display-mode: standalone)").matches
      || ("standalone" in navigator && navigator.standalone);
    return {isIOS, isAndroid, isStandalone, isMobile: isIOS || isAndroid};
  }

  // ---------- 印刷ガイド ----------
  const GUIDE_TEXTS = {
    ios_browser: [
      "① 下の「共有」ボタン(□↑)をタップ",
      "② 「プリント」を選択",
      "③ プレビュー画面で2本指でピンチアウト(広げる)",
      "④ 右上の共有ボタンから「ファイルに保存」"
    ],
    ios_pwa: [
      "① 画面を長押し → 「共有」または下部メニューから「印刷」",
      "② プレビュー画面で2本指でピンチアウト(広げる)",
      "③ 右上の共有ボタンから「ファイルに保存」",
      "💡 うまくいかない場合は「PDFをダウンロード」ボタンをお試しください"
    ],
    android: [
      "① 印刷プレビューが開きます",
      "② 上部または右上の「PDFとして保存」アイコン(↓)をタップ",
      "③ 保存先を選んで保存"
    ],
    pc: [
      "① 印刷ダイアログが開きます",
      "② 「プリンター / 送信先」を <strong>「PDFに保存」</strong> に変更",
      "③ 「保存」をクリック"
    ]
  };

  function showPrintGuide(){
    const {isIOS, isAndroid, isStandalone} = detectDevice();
    let key = "pc";
    if(isIOS) key = isStandalone ? "ios_pwa" : "ios_browser";
    else if(isAndroid) key = "android";
    const steps = GUIDE_TEXTS[key];
    const guideEl = el("pdfGuide");
    guideEl.innerHTML = steps.map(s=>`<div class="guide-step">${s}</div>`).join("");
    guideEl.classList.add("visible");
  }

  el("pdfBtn").addEventListener("click", ()=>{
    pushHistory();
    showPrintGuide();
    printReceipt();
  });

  // ---------- jsPDF ダウンロード ----------
  el("dlBtn").addEventListener("click", async ()=>{
    const btn = el("dlBtn");
    btn.disabled = true;
    btn.classList.add("loading");
    const orig = btn.textContent;
    btn.textContent = "PDF生成中…";
    try{
      pushHistory();
      await downloadPdf();
    } catch(err){
      console.error("PDF download error:", err);
      alert("PDFの生成に失敗しました。\n「印刷でPDF保存」ボタンをお試しください。");
    } finally {
      btn.disabled = false;
      btn.classList.remove("loading");
      btn.textContent = orig;
    }
  });

  async function downloadPdf(){
    if(!window.jspdf || !window.html2canvas){
      throw new Error("ライブラリが読み込まれていません");
    }
    const { jsPDF } = window.jspdf;
    const node = el("receipt");
    const wrap = el("receiptScaleWrap");
    const previewPanel = el("panelPreview");

    // モバイルでプレビューが hidden-mobile(display:none)の場合、
    // オフスクリーンに一時表示してからキャプチャする
    const wasHidden = previewPanel.classList.contains("hidden-mobile");
    if(wasHidden){
      previewPanel.classList.remove("hidden-mobile");
      previewPanel.style.cssText = "position:fixed;left:-9999px;top:0;width:640px;visibility:visible;z-index:-1;";
    }
    const prevTransform = wrap.style.transform;
    wrap.style.transform = "none";

    // フォント読み込み完了を待つ
    if(document.fonts?.ready) await document.fonts.ready.catch(()=>{});
    await new Promise(r=>setTimeout(r, 80));

    let canvas;
    try{
      canvas = await window.html2canvas(node, {
        scale: Math.min(window.devicePixelRatio || 1, 2) * 1.5,
        backgroundColor: "#ffffff",
        useCORS: true,
        logging: false,
        allowTaint: false
      });
    } finally {
      wrap.style.transform = prevTransform;
      if(wasHidden){
        previewPanel.classList.add("hidden-mobile");
        previewPanel.style.cssText = "";
      }
    }

    const imgData = canvas.toDataURL("image/jpeg", 0.95);
    const pdf = new jsPDF({unit:"pt", format:"a4", compress:true});
    const pw = pdf.internal.pageSize.getWidth();
    const ph = pdf.internal.pageSize.getHeight();
    const margin = 40;
    const maxW = pw - margin * 2;
    const maxH = ph - margin * 2;
    const ratio = canvas.height / canvas.width;
    let rw = maxW, rh = maxW * ratio;
    if(rh > maxH){ rh = maxH; rw = maxH / ratio; }
    const x = (pw - rw) / 2;
    const y = margin;
    pdf.addImage(imgData, "JPEG", x, y, rw, rh);
    pdf.save(buildFileName());
  }

  function printReceipt(){
    // 印刷ダイアログ(PDF保存)でファイル名の候補として使われるよう、タイトルを変更する。
    // setTimeoutで早めに元へ戻すと、スマホでダイアログを開いたままタイトルが
    // 「領収証メーカー」に戻ってしまい、それがファイル名候補になってしまうため、
    // 印刷/共有が完了して画面に戻ってきたタイミングで初めて復元する。
    const originalTitle = document.title;
    document.title = buildFileName().replace(/\.pdf$/,"");
    const printStartedAt = Date.now();

    let restored = false;
    function restoreTitle(){
      if(restored) return;
      // print()呼び出し直後にも一瞬 focus/visibilitychange が発火する環境があるため、
      // ダイアログが開くまでの猶予(600ms)を設けて誤って即時復元しないようにする
      if(Date.now() - printStartedAt < 600) return;
      restored = true;
      document.title = originalTitle;
      window.removeEventListener("afterprint", restoreTitle);
      window.removeEventListener("focus", restoreTitle);
      document.removeEventListener("visibilitychange", onVisibilityChange);
    }
    function onVisibilityChange(){
      if(document.visibilityState === "visible") restoreTitle();
    }
    window.addEventListener("afterprint", restoreTitle);
    window.addEventListener("focus", restoreTitle);
    document.addEventListener("visibilitychange", onVisibilityChange);

    window.print();
  }

  function buildFileName(){
    const datePart = (state.issueDate || "").replace(/-/g,"");
    const namePart = (state.clientName || "領収証").replace(/[\\/:*?"<>|]/g,"");
    return `領収証_${namePart}${datePart ? "_"+datePart : ""}.pdf`;
  }

  // ---------- init ----------
  populateFormFromState();
  applyResponsiveDefault();
  renderAll();
  flashSaved();

  // ---------- PWA: service worker registration & update detection ----------
  if("serviceWorker" in navigator){
    window.addEventListener("load", async ()=>{
      let reg;
      try{
        reg = await navigator.serviceWorker.register("service-worker.js");
      } catch(err){
        console.warn("Service worker registration failed:", err);
        return;
      }

      // 新しいSWがインストール済みで待機中(waiting)になっていたらバナーを表示
      function showUpdateBanner(worker){
        const banner = el("updateBanner");
        banner.style.display = "flex";

        el("updateNowBtn").onclick = ()=>{
          // SWに「今すぐ有効化して」と伝える
          worker.postMessage({type:"SKIP_WAITING"});
        };
        el("updateLaterBtn").onclick = ()=>{
          banner.style.display = "none";
        };
      }

      // すでに waiting 中のSWがあればすぐ表示
      if(reg.waiting){
        showUpdateBanner(reg.waiting);
      }

      // 新しいSWがインストールを完了してwaitingになったタイミングで表示
      reg.addEventListener("updatefound", ()=>{
        const newWorker = reg.installing;
        if(!newWorker) return;
        newWorker.addEventListener("statechange", ()=>{
          if(newWorker.state === "installed" && navigator.serviceWorker.controller){
            showUpdateBanner(newWorker);
          }
        });
      });

      // SWが切り替わったらページをリロードして新バージョンを反映
      let refreshing = false;
      navigator.serviceWorker.addEventListener("controllerchange", ()=>{
        if(refreshing) return;
        refreshing = true;
        window.location.reload();
      });

      // バックグラウンドで定期的に更新チェック(30分ごと)
      setInterval(()=>{ reg.update(); }, 30 * 60 * 1000);
    });
  }

})();
</script>
